; php-fpm pool sizing for a 1GB instance (t3.micro).
;
; Measured on the actual instance rather than the nominal spec: a t3.micro
; reports 908MB total, not 1024 -- AWS reserves the rest for firmware.
;
; Against that: MySQL ~300MB with the buffer pool tuned down, the OS ~200MB,
; nginx 20MB, and the queue worker and scheduler ~80MB each. That leaves
; roughly 230MB for PHP, so four workers at ~50MB is the honest ceiling.
;
; Four is ample here regardless -- a BLIS cohort is a few hundred students who
; are rarely online together, and each worker serves requests in milliseconds.
; Raise it only after observing requests actually queueing, and raise the
; instance size at the same time.
[www]
pm = dynamic
pm.max_children = 4
pm.start_servers = 2
pm.min_spare_servers = 1
pm.max_spare_servers = 2

; Recycle workers periodically so a slow leak in any dependency cannot
; accumulate across the life of the container.
pm.max_requests = 500

; Surface worker output in `docker compose logs` rather than swallowing it.
catch_workers_output = yes
decorate_workers_output = no
