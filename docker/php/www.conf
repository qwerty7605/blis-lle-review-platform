; php-fpm pool sizing for a 1GB instance (t3.micro).
;
; The arithmetic that matters: MySQL takes roughly 400MB, the OS about 150MB,
; nginx 20MB and the queue worker 80MB, leaving a little over 300MB for PHP.
; At ~50MB per worker, six children is the ceiling before the box starts
; swapping. Raise this only after raising the instance size.
[www]
pm = dynamic
pm.max_children = 6
pm.start_servers = 2
pm.min_spare_servers = 1
pm.max_spare_servers = 3

; Recycle workers periodically so a slow leak in any dependency cannot
; accumulate across the life of the container.
pm.max_requests = 500

; Surface worker output in `docker compose logs` rather than swallowing it.
catch_workers_output = yes
decorate_workers_output = no
