; Production PHP settings. The dev image copies php.ini-development wholesale,
; which is why uploads currently cap at 2M while nginx advertises 20m.

; --- uploads -----------------------------------------------------------
; Must not be lower than nginx's client_max_body_size, or a .docx between the
; two limits is rejected by PHP after nginx has already accepted the body.
; post_max_size sits slightly above upload_max_filesize to leave room for the
; rest of the multipart form.
upload_max_filesize = 20M
post_max_size = 21M

; --- limits ------------------------------------------------------------
; PhpWord parsing and PhpSpreadsheet export are the memory-hungry paths.
; This is a per-request ceiling, not a reservation.
memory_limit = 256M
max_execution_time = 60
max_input_vars = 3000

; --- disclosure --------------------------------------------------------
expose_php = Off
display_errors = Off
display_startup_errors = Off
log_errors = On
error_log = /dev/stderr

; --- opcache -----------------------------------------------------------
; validate_timestamps=0 means PHP never stats files looking for changes. That
; is the right call for an immutable image and a real speed win, but it also
; means code changes need a container restart, not just a file copy.
opcache.enable = 1
opcache.validate_timestamps = 0
opcache.memory_consumption = 128
opcache.interned_strings_buffer = 16
opcache.max_accelerated_files = 20000
