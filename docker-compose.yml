services:
  php:
    build: .
    working_dir: /var/www
    restart: unless-stopped
    volumes:
      - ./:/var/www
    depends_on:
      db:
        condition: service_healthy
    networks:
      - appnet
  nginx:
    image: nginx:1.29.5-alpine
    restart: unless-stopped
    ports:
      - "8080:80"
    volumes:
      - ./:/var/www
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - php
    networks:
      - appnet

  db:
    image: mysql:8.4.8
    container_name: lnu_lle_db
    restart: unless-stopped
    env_file:
      - ./.env.docker
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      # Actually authenticates as the application user and touches the app
      # database, so "healthy" means "the app can connect" -- php and queue
      # gate their startup on this. `mysqladmin ping` is not enough: it reports
      # success even when the credentials are wrong, because the server still
      # answered. "$$" is escaped so Compose passes a single "$" to the shell.
      test: ["CMD-SHELL", "mysql -h localhost -u\"$$MYSQL_USER\" -p\"$$MYSQL_PASSWORD\" -e 'SELECT 1' \"$$MYSQL_DATABASE\" >/dev/null 2>&1"]
      interval: 5s
      timeout: 5s
      retries: 20
    networks:
      - appnet

  phpmyadmin:
    image: phpmyadmin:5.2.3-apache
    restart: unless-stopped
    ports:
      - "8081:80"
    environment:
      - PMA_HOST=db
      - PMA_PORT=3306
    depends_on:
      - db
    networks:
      - appnet

  queue:
    build: .
    working_dir: /var/www
    restart: unless-stopped
    command: php artisan queue:work --sleep=1 --tries=3 --timeout=300
    volumes:
      - ./:/var/www
    depends_on:
      db:
        condition: service_healthy
    networks:
      - appnet

volumes:  
  mysql_data:
    name: blis_system_mysql_data

networks:
  appnet:
