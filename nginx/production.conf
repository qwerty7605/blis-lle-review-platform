# Production server block. Differs from nginx/default.conf in three ways: it
# serves the built SPA, it falls back to index.html so history-mode deep links
# work, and it sets security headers.

server {
    listen 80;
    server_name _;

    root /var/www/public;
    index index.html index.php;

    # Matches upload_max_filesize in docker/php/production.ini. If you raise
    # one, raise the other, or uploads between the two limits fail after the
    # body has already been transferred.
    client_max_body_size 20m;

    # --- security headers ------------------------------------------------
    # NOTE a long-standing nginx footgun: a location block containing ANY
    # add_header discards every add_header inherited from the server block.
    # That is why the static-asset location below uses `expires` alone and
    # sets no headers of its own.
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    # 'unsafe-inline' for styles is unavoidable here: Vue :style bindings
    # compile to inline style attributes, which CSP counts as inline styles.
    # Scripts need no such exemption -- Vite emits external files only.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self' data:; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;

    # Enable ONLY once TLS is terminating in front of this, and only when you
    # are sure -- browsers honour it for the full max-age and you cannot take
    # it back. Start with a short max-age if unsure.
    # add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # --- compression -----------------------------------------------------
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/json application/javascript
               application/xml text/xml image/svg+xml;

    # --- the API ---------------------------------------------------------
    # Listed before the SPA fallback so /api never resolves to index.html.
    location /api {
        try_files $uri /index.php?$query_string;
    }

    location = /up {
        try_files $uri /index.php?$query_string;
    }

    location ~ \.php$ {
        include fastcgi_params;
        fastcgi_pass php:9000;
        fastcgi_index index.php;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_hide_header X-Powered-By;

        # Report exports over large rooms can outrun the 60s default.
        fastcgi_read_timeout 120s;
    }

    # --- static assets ---------------------------------------------------
    # Vite fingerprints these filenames, so a year is safe: a changed file is
    # a new name. `expires` only -- see the add_header note above.
    location /assets/ {
        expires 1y;
        access_log off;
    }

    # --- the SPA ---------------------------------------------------------
    # Everything else is a client-side route. Without this fallback a refresh
    # on /dashboard/rooms reaches Laravel, which has no such route, and 404s.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # index.html must never be cached, or browsers keep loading a stale shell
    # that references asset filenames the last deploy removed.
    location = /index.html {
        expires -1;
    }

    location ~ /\. {
        deny all;
    }
}
