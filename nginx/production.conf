# Production server blocks. Differ from nginx/default.conf by serving the built
# SPA, falling back to index.html so history-mode deep links survive a refresh,
# setting security headers, and terminating TLS.
#
# The hostname is hardcoded deliberately. Canonicalising on one origin matters
# here because the auth cookie is host-only: signing in at www. would produce a
# cookie the bare domain never sees, so a user who followed an emailed link
# (built from APP_URL) would silently appear signed out.

# --- HTTP: answer ACME, send everything else to HTTPS -----------------------
server {
    listen 80;
    server_name lnu-blis.live www.lnu-blis.live;

    # Must stay reachable over plain HTTP forever: every renewal repeats this
    # exchange, and it cannot happen over a certificate that has expired.
    #
    # "^~" is load-bearing -- see the note on the duplicate block below.
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
        default_type "text/plain";
    }

    location / {
        return 301 https://lnu-blis.live$request_uri;
    }
}

# --- HTTPS: fold www into the canonical host --------------------------------
server {
    listen 443 ssl;
    http2 on;
    server_name www.lnu-blis.live;

    ssl_certificate     /etc/letsencrypt/live/lnu-blis.live/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/lnu-blis.live/privkey.pem;

    return 301 https://lnu-blis.live$request_uri;
}

# --- HTTPS: the application -------------------------------------------------
server {
    listen 443 ssl;
    http2 on;
    server_name lnu-blis.live;

    ssl_certificate     /etc/letsencrypt/live/lnu-blis.live/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/lnu-blis.live/privkey.pem;

    # TLS 1.2 is kept for older Android devices still in use; anything below
    # it is broken in ways no configuration can rescue.
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    root /var/www/public;
    index index.html index.php;

    # Matches upload_max_filesize in docker/php/production.ini. If you raise
    # one, raise the other, or uploads between the two limits fail after the
    # body has already been transferred.
    client_max_body_size 20m;

    # --- security headers ------------------------------------------------
    # NOTE a long-standing nginx footgun: a location block containing ANY
    # add_header discards every add_header inherited from the server block.
    # That is why the static-asset location below uses `expires` alone and
    # sets no headers of its own.
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    # Backstop for robots.txt. Crawlers that ignore the file still see this,
    # and it covers responses fetched without the crawler reading robots.txt.
    add_header X-Robots-Tag "noindex, nofollow" always;

    # 'unsafe-inline' for styles is unavoidable here: Vue :style bindings
    # compile to inline style attributes, which CSP counts as inline styles.
    # Scripts need no such exemption -- Vite emits external files only.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self' data:; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;

    # One year, the usual value. It began at 300s while HTTPS was new, since
    # browsers keep the rule for the whole max-age and it cannot be withdrawn
    # early; HTTPS has been stable since October 2026.
    #
    # includeSubDomains is still omitted: it would commit every future
    # subdomain to HTTPS before any exists.
    add_header Strict-Transport-Security "max-age=31536000" always;

    # --- compression -----------------------------------------------------
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/json application/javascript
               application/xml text/xml image/svg+xml;

    # --- the API ---------------------------------------------------------
    # Listed before the SPA fallback so /api never resolves to index.html.
    location /api {
        try_files $uri /index.php?$query_string;
    }

    location = /up {
        try_files $uri /index.php?$query_string;
    }

    location ~ \.php$ {
        include fastcgi_params;
        fastcgi_pass php:9000;
        fastcgi_index index.php;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_hide_header X-Powered-By;

        # Report exports over large rooms can outrun the 60s default.
        fastcgi_read_timeout 120s;
    }

    # --- static assets ---------------------------------------------------
    # Vite fingerprints these filenames, so a year is safe: a changed file is
    # a new name. `expires` only -- see the add_header note above.
    location /assets/ {
        expires 1y;
        access_log off;
    }

    # --- the SPA ---------------------------------------------------------
    # Everything else is a client-side route. Without this fallback a refresh
    # on /dashboard/rooms reaches Laravel, which has no such route, and 404s.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # index.html must never be cached, or browsers keep loading a stale shell
    # that references asset filenames the last deploy removed.
    location = /index.html {
        expires -1;
    }

    location ~ /\. {
        deny all;
    }
}
